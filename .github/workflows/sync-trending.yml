name: Sync Hugging Face trending models

# Runs every Monday at 06:00 UTC. Also exposed as a manual trigger so you can
# refresh on demand from the Actions tab.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write    # needed to push the updated snapshot back to the repo

concurrency:
  group: sync-trending
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run trending sync
        env:
          # Optional: improves HF rate limits when present.
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
        run: npm run sync:trending

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet data/trending.json; then
            echo "No changes to commit."
            exit 0
          fi

          git add data/trending.json
          git commit -m "chore(trending): refresh Hugging Face snapshot $(date -u +%Y-%m-%d)"
          git push
